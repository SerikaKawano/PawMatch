<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#45606b"/></marker>
    <style>
      .t{font-family:Arial,"Noto Sans",sans-serif;fill:#183943}.title{font-size:38px;font-weight:800}.head{font-size:28px;font-weight:800}.body{font-size:22px}.small{font-size:19px}.line{stroke:#45606b;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="t title">PawMatch roles and division of enquiry and review work</text>
  <rect x="480" y="100" width="640" height="150" rx="18" fill="#f5f9fa" stroke="#0b7180" stroke-width="4"/>
  <circle cx="565" cy="175" r="38" fill="#0b7180"/><path d="M546 165h38v24h-24l-12 10v-10h-2z" fill="#fff"/>
  <text x="625" y="161" class="t head">Shared enquiry and message thread</text>
  <text x="625" y="196" class="t small">All three parties see the same conversation</text>
  <text x="625" y="224" class="t small">and progress</text>

  <path d="M560 250 C450 295 340 305 285 355" class="line"/>
  <path d="M1040 250 C1150 295 1260 305 1315 355" class="line"/>
  <path d="M800 250 L800 348" class="line"/>

  <rect x="65" y="365" width="430" height="330" rx="18" fill="#fff5f8" stroke="#bb3e68" stroke-width="4"/>
  <circle cx="280" cy="435" r="38" fill="#bb3e68"/><circle cx="280" cy="423" r="11" fill="#fff"/><path d="M258 458c5-18 39-18 44 0" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="280" y="515" text-anchor="middle" class="t head">1 Adopter</text>
  <text x="100" y="563" class="t body">• asks about the pet</text>
  <text x="100" y="605" class="t body">• submits profile and documents</text>
  <text x="100" y="647" class="t body">• responds to guidance and questions</text>

  <rect x="1105" y="365" width="430" height="330" rx="18" fill="#fff9e9" stroke="#d69b16" stroke-width="4"/>
  <circle cx="1320" cy="435" r="38" fill="#d69b16"/><path d="M1297 438c10-25 36-25 46 0M1306 427l-9-16 19 7M1334 427l9-16-19 7" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="1320" y="515" text-anchor="middle" class="t head">2 Rehomer</text>
  <text x="1140" y="563" class="t body">• provides the pet's daily care</text>
  <text x="1140" y="600" class="t small">• answers about behaviour, health</text>
  <text x="1163" y="632" class="t small">and daily care</text>
  <text x="1140" y="671" class="t small">• joins meetings, trials and adoption</text>

  <rect x="565" y="365" width="470" height="390" rx="18" fill="#eff8f9" stroke="#0b7180" stroke-width="4"/>
  <circle cx="800" cy="435" r="38" fill="#0b7180"/><rect x="780" y="414" width="40" height="46" rx="5" fill="#fff"/><path d="M790 427h20M790 438h20M790 449h14" stroke="#0b7180" stroke-width="4"/>
  <text x="800" y="515" text-anchor="middle" class="t head">3–4 PawMatch operations</text>
  <text x="600" y="558" class="t body">Reviewers</text>
  <text x="625" y="595" class="t small">• suitability, documents, identity checks</text>
  <text x="625" y="628" class="t small">• workflow, rationale and records</text>
  <text x="600" y="674" class="t body">Administrators</text>
  <text x="625" y="711" class="t small">• roles, settings, audit and operations</text>

  <rect x="170" y="800" width="1260" height="66" rx="14" fill="#f7f2ea" stroke="#d7c5b3" stroke-width="2"/>
  <text x="800" y="842" text-anchor="middle" class="t body">Direct dialogue remains; PawMatch operations supports burdensome screening, procedures and checks</text>
</svg>
